<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dlano — KIU Voice Assistant</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #5f6b80;
      --brand: #0b3d91; --brand-soft: #e6edfa; --accent: #d62839; --ok: #1f8a4c; --border: #dde3ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141c; --card: #1a202b; --text: #e8ecf3; --muted: #9aa5b8;
        --brand: #6f9cf0; --brand-soft: #22304a; --accent: #ff5c6c; --ok: #4cc283; --border: #2c3545;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; padding: 16px;
    }
    main { width: 100%; max-width: 720px; }
    header { text-align: center; margin: 12px 0 20px; }
    header h1 { margin: 0; font-size: 1.5rem; color: var(--brand); }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    #log { min-height: 240px; max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--brand); color: #fff; }
    .bot { align-self: flex-start; background: var(--brand-soft); }
    .sources { margin-top: 6px; font-size: 0.8rem; }
    .sources a { color: var(--brand); display: block; overflow-wrap: anywhere; }
    .hint { color: var(--muted); text-align: center; margin: auto; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 18px; }
    #mic {
      width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--brand); color: #fff; font-size: 2rem;
      box-shadow: 0 4px 14px rgba(11, 61, 145, 0.35); transition: transform .15s;
    }
    #mic:hover { transform: scale(1.05); }
    #mic.on { background: var(--ok); }
    #mic.awake { background: var(--accent); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,40,57,.5); } 50% { box-shadow: 0 0 0 16px rgba(214,40,57,0); } }
    #status { color: var(--muted); font-size: 0.9rem; min-height: 1.2em; text-align: center; }
    #caller { font-size: 0.85rem; color: var(--muted); min-height: 1.1em; }
    form { display: flex; gap: 8px; width: 100%; }
    input[type=text] {
      flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 1rem;
    }
    button.send { padding: 10px 16px; border-radius: 10px; border: none; background: var(--brand); color: #fff; cursor: pointer; }
    label { color: var(--muted); font-size: 0.85rem; }
    .lang { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .lang button {
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 0.9rem;
    }
    .lang button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Dlano — KIU Voice Assistant</h1>
    <p id="tagline"></p>
  </header>

  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="sw">Kiswahili</button>
  </div>

  <section class="card">
    <div id="log"><p class="hint" id="hint"></p></div>
  </section>

  <div class="controls">
    <button id="mic" aria-label="Turn Dlano on or off">🎤</button>
    <div id="status"></div>
    <div id="caller"></div>
    <form id="textForm">
      <input id="textInput" type="text" autocomplete="off" />
      <button class="send" id="sendBtn" type="submit"></button>
    </form>
    <label><input type="checkbox" id="speak" checked /> <span id="speakLabel"></span></label>
  </div>
</main>

<script>
  const log = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const callerEl = document.getElementById("caller");
  const mic = document.getElementById("mic");
  const speakToggle = document.getElementById("speak");

  const TEXT = {
    en: {
      tagline: "Say “Dlano” to start, then ask anything about Kampala International University.",
      hint: "Tap the microphone once to switch Dlano on, then say “Dlano…”.",
      placeholder: "…or type to Dlano", send: "Send", speakLabel: "Speak answers aloud",
      sources: "Sources:", thinking: "Thinking…", heard: "Heard: ",
      off: "Dlano is off. Tap the microphone to switch on.",
      sleeping: "Listening for “Dlano”…", awake: "I'm listening…", talkingTo: "Talking with: ",
      error: "Sorry, something went wrong: ",
      offline: "Can't reach the assistant server. Start it with \"uvicorn server:app --port 8000\" in the kiu-voice-assistant folder, then open http://localhost:8000 (don't open index.html directly).",
      blocked: "Microphone access was blocked. Allow it in the browser's address bar, then tap the microphone.",
      noVoice: "Voice input isn't supported in this browser. Use Chrome or Edge, or type to Dlano below.",
      speech: ["en-GB", "en-UG", "en-KE", "en-US"],
      askName: "Hello! I'm Dlano, Kampala International University's assistant. Before we begin, may I know your name?",
      askNameAgain: "Sorry, I didn't catch your name. Please tell me just your name, for example, my name is Sarah.",
      noName: "No problem. How can I help you with KIU today?",
      welcome: (n) => `Nice to meet you, ${n}.`,
      howHelp: (n) => `How can I help you with KIU today, ${n}?`,
      yes: (n) => n ? `Yes, ${n}? I'm listening.` : "Yes? I'm listening.",
      bye: (n) => n ? `Goodbye, ${n}. Thank you for contacting Kampala International University. Say Dlano any time you need me.`
                    : "Goodbye. Thank you for contacting Kampala International University. Say Dlano any time you need me.",
      timeout: "Session ended after a quiet spell. Say “Dlano” to start again.",
    },
    sw: {
      tagline: "Sema “Dlano” kuanza, kisha uliza chochote kuhusu Kampala International University.",
      hint: "Gusa kipaza sauti mara moja kumwasha Dlano, kisha sema “Dlano…”.",
      placeholder: "…au mwandikie Dlano", send: "Tuma", speakLabel: "Soma majibu kwa sauti",
      sources: "Vyanzo:", thinking: "Inafikiri…", heard: "Nimesikia: ",
      off: "Dlano amezimwa. Gusa kipaza sauti kumwasha.",
      sleeping: "Ninasikiliza “Dlano”…", awake: "Ninakusikiliza…", talkingTo: "Unazungumza na: ",
      error: "Samahani, kuna tatizo: ",
      offline: "Siwezi kufikia seva ya msaidizi. Iwashe kwa \"uvicorn server:app --port 8000\" ndani ya folda ya kiu-voice-assistant, kisha fungua http://localhost:8000 (usifungue index.html moja kwa moja).",
      blocked: "Ruhusa ya kipaza sauti imezuiwa. Iruhusu kwenye upau wa anwani, kisha gusa kipaza sauti.",
      noVoice: "Kivinjari hiki hakitumii sauti. Tumia Chrome au Edge, au mwandikie Dlano hapa chini.",
      speech: ["sw-KE", "sw-TZ", "sw-UG", "sw"],
      askName: "Habari! Mimi ni Dlano, msaidizi wa Kampala International University. Kabla hatujaanza, naomba kujua jina lako?",
      askNameAgain: "Samahani, sikusikia jina lako vizuri. Tafadhali niambie jina lako tu, kwa mfano, jina langu ni Amina.",
      noName: "Sawa. Nikusaidie vipi kuhusu KIU leo?",
      welcome: (n) => `Nafurahi kukufahamu, ${n}.`,
      howHelp: (n) => `Nikusaidie vipi kuhusu KIU leo, ${n}?`,
      yes: (n) => n ? `Ndiyo, ${n}? Ninakusikiliza.` : "Ndiyo? Ninakusikiliza.",
      bye: (n) => n ? `Kwaheri, ${n}. Asante kwa kuwasiliana na Kampala International University. Sema Dlano wakati wowote ukinihitaji.`
                    : "Kwaheri. Asante kwa kuwasiliana na Kampala International University. Sema Dlano wakati wowote ukinihitaji.",
      timeout: "Mazungumzo yamekwisha baada ya kimya. Sema “Dlano” kuanza tena.",
    },
  };
  let lang = "en";
  try { if (localStorage.getItem("kiu-lang") === "sw") lang = "sw"; } catch (e) {}
  const t = (key) => TEXT[lang][key];

  // Speech recognisers write "Dlano" many ways: Delano, D Lano, the Lano, Dylan-o, Milano...
  const WAKE = /\b(?:d|de|dee|di|da|the)[\s-]?l+a+n+o+\b|\bdylan[\s-]?o\b|\bmilano\b/i;
  const WAKE_ALL = new RegExp(WAKE.source, "gi");
  const FAREWELL = /\b(good ?bye|bye|that'?s all|that is all|end (the )?call|kwaheri|ndiyo hivyo tu|inatosha)\b/i;
  const NOT_NAMES = /^(no|nope|skip|why|nothing|none|hapana|sitaki|sawa|ok|okay|yes|ndiyo|hello|hi|habari)$/i;
  const SESSION_IDLE_MS = 90_000;

  // Conversation state: "sleep" (waiting for the wake word) -> "askName" -> "chat".
  let mode = "sleep";
  let caller = { name: "", pending: "", nameTries: 0 };
  let history = [];
  let idleTimer = null;
  let busy = false;

  function setStatus(text) { statusEl.textContent = text; }
  // Dlano addresses callers by first name; the full name is shown on screen.
  const firstName = () => caller.name.split(" ")[0];

  function refreshIndicators() {
    mic.classList.toggle("on", wantListening);
    mic.classList.toggle("awake", wantListening && mode !== "sleep");
    callerEl.textContent = caller.name ? t("talkingTo") + caller.name : "";
    if (!busy && !speaking) {
      if (!recognizer) setStatus(t("noVoice"));
      else if (!wantListening) setStatus(t("off"));
      else setStatus(mode === "sleep" ? t("sleeping") : t("awake"));
    }
  }

  function addMessage(role, text, sources) {
    document.getElementById("hint")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");
    div.textContent = text;
    if (sources && sources.length) {
      const s = document.createElement("div");
      s.className = "sources";
      s.append(t("sources"));
      for (const src of sources) {
        const a = document.createElement("a");
        a.href = src.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = src.title || src.url;
        s.append(a);
      }
      div.append(s);
    }
    log.append(div);
    log.scrollTop = log.scrollHeight;
  }

  // ---------- Speaking ----------
  let speaking = false;

  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    for (const code of t("speech")) {
      const v = voices.find(v => v.lang.replace("_", "-").toLowerCase().startsWith(code.toLowerCase()));
      if (v) return v;
    }
    return null;
  }

  // Speaks the text and resolves when finished. The microphone is paused meanwhile so
  // Dlano doesn't hear (and answer) itself.
  function speak(text) {
    if (!speakToggle.checked || !("speechSynthesis" in window)) return Promise.resolve();
    speaking = true;
    stopRecognition();
    speechSynthesis.cancel();
    // Chrome cuts off long utterances, so speak sentence by sentence.
    const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
    const voice = pickVoice();
    return new Promise((resolve) => {
      let left = parts.length, finished = false;
      const done = () => {
        if (finished || --left > 0) return;
        finished = true;
        clearTimeout(safety);
        speaking = false;
        resolve();
        startRecognition();
      };
      // If the browser never fires "end", don't leave the microphone paused forever.
      const safety = setTimeout(() => { left = 1; done(); }, 4000 + text.length * 90);
      window._utterances = parts.map((part) => {
        const u = new SpeechSynthesisUtterance(part.trim());
        u.lang = voice ? voice.lang : t("speech")[0];
        if (voice) u.voice = voice;
        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);
        return u;  // kept referenced: Chrome drops events of garbage-collected utterances
      });
    });
  }

  async function reply(text, sources) {
    addMessage("bot", text, sources);
    await speak(text);
    startRecognition();  // also needed when answers aren't spoken aloud
    refreshIndicators();
  }

  // ---------- Conversation ----------
  function touchSession() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (mode === "sleep" || busy || speaking) return touchSession();
      endSession();
      setStatus(t("timeout"));
    }, SESSION_IDLE_MS);
  }

  function endSession() {
    clearTimeout(idleTimer);
    mode = "sleep";
    caller = { name: "", pending: "", nameTries: 0 };
    history = [];
    refreshIndicators();
  }

  function stripWake(text) {
    return text.replace(WAKE_ALL, " ").replace(/^[\s,.!?:;-]+/, "").replace(/\s+/g, " ").trim();
  }

  // Pulls a name out of answers like "My name is Amina", "I'm John Okello", "Naitwa Baraka", "Peter".
  function extractName(text) {
    let s = stripWake(text).replace(/[.!?]+$/, "");
    const intro = /^(?:(?:hi|hello|hey|habari|jambo|ok(?:ay)?|yes|ndiyo|sawa)[,\s]+)*(?:my name is|my name's|i am|i'm|im|call me|this is|it's|it is|name is|jina langu ni|naitwa|mimi ni|ni)\s+/i;
    const hadIntro = intro.test(s);
    s = s.replace(intro, "").split(/[,;]|\s(?:and|na|from|kutoka)\s/i)[0].trim();
    const words = s.split(/\s+/).filter(Boolean);
    if (!words.length || words.length > 3 || (!hadIntro && words.length > 2)) return "";
    if (!words.every(w => /^[\p{L}'-]+$/u.test(w)) || NOT_NAMES.test(words[0])) return "";
    return words.map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join(" ");
  }

  async function handleUtterance(text, typed = false) {
    text = text.trim();
    if (!text || busy || speaking) return;

    if (mode === "sleep") {
      const m = text.match(WAKE);
      if (!m && !typed) return;  // ordinary room talk: ignore until someone says "Dlano"
      addMessage("user", text);
      const rest = m ? stripWake(text.slice(m.index)) : text;
      mode = "askName";
      caller = { name: "", pending: rest, nameTries: 0 };
      touchSession();
      return reply(t("askName"));
    }

    addMessage("user", text);
    touchSession();

    if (mode === "askName") {
      const name = extractName(text);
      if (!name) {
        // A long sentence instead of a name is probably their question: keep it for later.
        if (stripWake(text).split(/\s+/).length > 3) caller.pending = stripWake(text);
        if (++caller.nameTries < 2) return reply(t("askNameAgain"));
        mode = "chat";
        return caller.pending ? ask(caller.pending) : reply(t("noName"));
      }
      caller.name = name;
      mode = "chat";
      refreshIndicators();
      const pending = caller.pending;
      caller.pending = "";
      if (!pending) return reply(`${t("welcome")(firstName())} ${t("howHelp")(firstName())}`);
      await reply(t("welcome")(firstName()));
      return ask(pending);
    }

    // mode === "chat": every utterance is for Dlano until goodbye or a quiet spell.
    const question = stripWake(text);
    if (!question) return reply(t("yes")(firstName()));
    if (FAREWELL.test(question) && question.split(/\s+/).length <= 6) {
      const name = firstName();
      endSession();
      return reply(t("bye")(name));
    }
    return ask(question);
  }

  async function ask(question) {
    busy = true;
    stopRecognition();
    setStatus(t("thinking"));
    let answer, sources;
    try {
      let res;
      try {
        res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history, language: lang, caller_name: firstName() || null }),
        });
      } catch (networkErr) {
        throw new Error(t("offline"));  // server not running, or page not opened from it
      }
      const data = await res.json().catch(() => ({ detail: t("offline") }));
      if (!res.ok) throw new Error(data.detail || "Request failed");
      answer = data.answer;
      sources = data.sources;
      history.push({ role: "user", content: question }, { role: "assistant", content: answer });
      history = history.slice(-12);
    } catch (err) {
      answer = err.message === t("offline") ? err.message : t("error") + err.message;
    } finally {
      busy = false;
    }
    touchSession();
    await reply(answer, sources);
  }

  // ---------- Listening (always on once switched on) ----------
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null, recognizing = false, wantListening = false, restartDelay = 250;

  function startRecognition() {
    if (!recognizer || !wantListening || recognizing || speaking || busy) return;
    recognizer.lang = t("speech")[0];
    try { recognizer.start(); recognizing = true; } catch (e) { /* already starting */ }
  }

  function stopRecognition() {
    if (recognizer && recognizing) { try { recognizer.abort(); } catch (e) {} }
  }

  if (Recognition) {
    recognizer = new Recognition();
    recognizer.continuous = true;
    recognizer.interimResults = true;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = (e) => {
      restartDelay = 250;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const said = e.results[i][0].transcript;
        if (e.results[i].isFinal) handleUtterance(said);
        else if (mode !== "sleep" || WAKE.test(said)) setStatus(t("heard") + "“" + said + "”");
      }
    };
    recognizer.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wantListening = false;
        refreshIndicators();
        setStatus(t("blocked"));
      } else if (e.error === "network") {
        restartDelay = Math.min(restartDelay * 2, 10000);
      }
    };
    // Browsers end recognition after silence or a minute or so; restart while Dlano is on.
    recognizer.onend = () => {
      recognizing = false;
      if (wantListening) setTimeout(startRecognition, restartDelay);
    };
  }

  mic.addEventListener("click", () => {
    if (!recognizer) return setStatus(t("noVoice"));
    wantListening = !wantListening;
    if (wantListening) {
      if ("speechSynthesis" in window) speechSynthesis.getVoices();
      startRecognition();
    } else {
      stopRecognition();
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      endSession();
    }
    refreshIndicators();
  });

  document.getElementById("textForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("textInput");
    handleUtterance(input.value, true);
    input.value = "";
  });

  function applyLanguage(next) {
    lang = next;
    try { localStorage.setItem("kiu-lang", lang); } catch (e) {}
    document.documentElement.lang = lang;
    for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
    document.getElementById("tagline").textContent = t("tagline");
    const hint = document.getElementById("hint");
    if (hint) hint.textContent = t("hint");
    document.getElementById("textInput").placeholder = t("placeholder");
    document.getElementById("sendBtn").textContent = t("send");
    document.getElementById("speakLabel").textContent = t("speakLabel");
    refreshIndicators();
  }

  for (const b of document.querySelectorAll(".lang button")) {
    b.addEventListener("click", () => {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      stopRecognition();  // restarts in the new language via onend
      applyLanguage(b.dataset.lang);
    });
  }

  applyLanguage(lang);
  if (location.protocol === "file:") addMessage("bot", t("offline"));
  // Voices load asynchronously in some browsers; touching the list starts the load.
  if ("speechSynthesis" in window) speechSynthesis.getVoices();
</script>
</body>
</html>
