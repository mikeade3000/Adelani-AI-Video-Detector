# Tests and deploys Dlano to Cloudflare when its code changes on main,
# after each successful website crawl, or on demand.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY
name: Deploy Dlano to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "kiu-voice-assistant/**"
      - ".github/workflows/kiu-deploy-cloudflare.yml"
  workflow_run:
    workflows: ["Crawl kiu.ac.ug"]
    types: [completed]
  workflow_dispatch:

concurrency: deploy-dlano

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kiu-voice-assistant
    steps:
      - uses: actions/checkout@v4

      - name: Check the website content is there
        run: |
          test -s data/pages.jsonl || {
            echo "::error::data/pages.jsonl is missing. Run the 'Crawl kiu.ac.ug' workflow first (Actions tab > Crawl kiu.ac.ug > Run workflow)."
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          pip install -r requirements.txt
          pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Cloudflare tools
        run: npm ci

      - name: Deploy (builds the Docker image and uploads it)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set the Anthropic API key on the Worker
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
